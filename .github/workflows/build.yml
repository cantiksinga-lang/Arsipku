name: Build APK ArsipKu

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Siapkan keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KS_ALIAS:-alhafidz}" >> "$GITHUB_ENV"
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks/release.jks" -alias alhafidz \
              -keyalg RSA -keysize 2048 -validity 36500 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Rizal Alhafidz, O=Alhafidz, C=ID"
            printf "KEYSTORE_PASSWORD=%s\nKEY_ALIAS=alhafidz\n" "$PASS" > "$RUNNER_TEMP/ks/INFO.txt"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=alhafidz" >> "$GITHUB_ENV"
            echo "KS_GENERATED=true" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ks/release.jks" >> "$GITHUB_ENV"

      - name: Build APK release
        run: gradle :app:assembleRelease --no-daemon

      - name: Ukuran APK
        run: ls -l app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ArsipKu-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Simpan keystore (hanya jika baru dibuat)
        if: env.KS_GENERATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-SIMPAN-INI
          path: ${{ runner.temp }}/ks/*
