name: GarasiKu Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cukup setup Android SDK, TANPA packages & TANPA cmdline-tools-version
      # agar tidak memicu download ulang / konflik versi.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Terima semua lisensi secara non-interaktif (ini yang sebelumnya bikin stuck di "Accept? (y/N)")
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # Install paket SDK yang dibutuhkan secara eksplisit
      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Build release APK (unsigned)
        run: gradle assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GarasiKu-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
