name: Build GarasiKu APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Buat keystore jika belum ada
        run: |
          if [ ! -f app/garasiku.jks ]; then
            keytool -genkeypair -keystore app/garasiku.jks -alias garasiku -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass garasiku123 -keypass garasiku123 -dname "CN=GarasiKu, O=Alhafidz, C=ID"
          fi

      - name: Build APK release
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: GarasiKu-APK
          path: app/build/outputs/apk/release/*.apk
