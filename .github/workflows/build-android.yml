name: Build GarasiKu APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      # Opsional: pakai keystore tetap supaya APK baru bisa menimpa (update) APK lama.
      # Buat secret DEBUG_KEYSTORE_BASE64 (lihat README).
      - name: Restore keystore (opsional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Keystore dipulihkan"
          fi

      - name: Buat scaffold Android (package com.alhafidz.app)
        run: |
          flutter create --platforms=android --org com.alhafidz --project-name app .
          rm -rf test

      - name: Terapkan kode native (widget, notifikasi, manifest, icon)
        run: bash tools/apply_overlay.sh

      - name: Generate icon app
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 tools/make_icon.py

      - run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release --no-shrink

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk GarasiKu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GarasiKu-apk
          path: GarasiKu.apk
